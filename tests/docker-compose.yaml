version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: exampledb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d # Mounts the folder for initialization scripts

  mssql-linux:
    image: mcr.microsoft.com/mssql/server
    container_name: mssql-linux
    ports:
      - "1433:1433"
    logging:
      driver: "none"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password123!"
    volumes:
      - ./mssql-init:/var/opt/mssql/scripts # Mounts the folder for initialization scripts
    user: root # Ensure root is used for package installations
    command: >
      /bin/bash -c "
      apt-get update &&
      apt-get install -y msodbcsql17 mssql-tools unixodbc-dev &&
      /opt/mssql/bin/sqlservr & 
      sleep 60 &&
      /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'Password123!' -i /var/opt/mssql/scripts/init.sql &&
      tail -f /dev/null
      "
