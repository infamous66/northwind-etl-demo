name: SQL Migration and Test Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install ODBC 17 for SQL Server
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft*
        sudo rm -f /etc/apt/trusted.gpg.d/microsoft*
        curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/microsoft.gpg
        sudo apt-get update
        sudo apt-get install -y lsb-release
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev
        odbcinst -j

    - name: Start SQL servers with Docker Compose
      uses: hoverkraft-tech/compose-action@v2.0.1
      with:
        compose-file: ./tests/docker-compose.yaml

    - name: Wait for database initialization
      run: sleep 75  # MSSQL needs 60s sleep + buffer in its startup command

    - name: Run data migration with migrator.py
      run: python ./migrator.py

    - name: Run migration tests
      run: |
        cd ./tests/
        python test2.py

    - name: Archive code coverage results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: ./tests/mismatched_employees.csv