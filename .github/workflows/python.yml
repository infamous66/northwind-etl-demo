name: SQL Migration and Test Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install SQL Server ODBC Driver
      run: |
        # Add Microsoft repository and install ODBC driver
        apt-get update
        apt-get install -y lsb-release
        curl -sSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list > /etc/apt/sources.list.d/mssql-release.list
        curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/trusted.gpg.d/microsoft.gpg
        apt-get update
        ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev
        odbcinst -j  # Verify installation

    - name: Start SQL servers with Docker Compose
      uses: hoverkraft-tech/compose-action@v2.0.1
      with:
        compose-file: ./tests/docker-compose.yaml

    - name: Wait for database initialization
      run: sleep 75  # MSSQL needs 60s sleep + buffer in its startup command

    - name: Run data migration with migrator.py
      run: python ./migrator.py

    - name: Run migration tests
      run: python ./tests/test2.py